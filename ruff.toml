line-length = 140
target-version = "py311"

exclude = [".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "B008",    # FastAPI dependencies are declared as call defaults
    "SIM105",  # contextlib.suppress hides which call is expected to fail
    "SIM108",  # nested ternaries read worse than the if/elif chains they replace
]

[lint.per-file-ignores]
# Long literals that should not be wrapped: the portal HTML/CSS and Spark SQL DDL.
"api/app.py" = ["E501"]
"jobs/create_tables.py" = ["E501"]
"risk_analytics/transformations/components.py" = ["E501"]
"risk_analytics/yaml_executor.py" = ["E501"]
# Entry points that extend sys.path before importing the project package.
"jobs/execute_pipeline.py" = ["E402"]
"scripts/run_local_python_no_airflow.py" = ["E402"]
# DAG factories rebind loop variables into globals(), which ruff reads as unused.
"airflow/dags/*.py" = ["B023"]
# Tests build fake modules whose signatures must match the real ones.
# Returning inside the patch context manager would change what stays mocked.
"tests/*.py" = ["ARG002", "ARG003", "ARG005", "E501", "PTH123", "RET504"]

[lint.isort]
known-first-party = ["risk_analytics", "jobs", "api", "ui", "ra_common"]
# The repo has an ``airflow/`` directory, which otherwise looks first-party.
known-third-party = ["airflow"]
