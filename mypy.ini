[mypy]
python_version = 3.11
files = risk_analytics, jobs, api, ui, scripts, airflow/dags
ignore_missing_imports = True
follow_imports = normal
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
mypy_path = airflow/dags
explicit_package_bases = True
namespace_packages = True

; DAG factories assign generated DAGs into globals(); typing that adds no value.
[mypy-ra_stage_jobs]
disable_error_code = index

[mypy-ra_ods_jobs]
disable_error_code = index

[mypy-ra_kafka_streaming]
disable_error_code = index
