version: 1
name: trans_SourceA_transform

sources:
  - name: trans_src
    type: table
    table: nessie.risk_analytics.trades
    filters:
      - as_of_date = '{{as_of_date}}'

steps:
  - id: trans_select
    type: reformat
    input: trans_src
    operations:
      - op: add_column
        name: source_system
        expression:
          lit: 'SourceA'
      - op: add_column
        name: ingest_timestamp
        expression:
          op: current_timestamp
          args: []
    select:
      - trade_id
      - customer_id
      - netting_set_id
      - product_type
      - trade_date
      - maturity_date
      - currency
      - notional
      - mark_to_market
      - status
      - as_of_date
      - source_system
      - ingest_timestamp
    emit:
      output: trans_prepared

targets:
  - name: trans_sourcea_stg
    dataset: trans_prepared
    table: nessie.risk_analytics.trades_sourcea_stg
    mode: append

  - name: trans_canonical
    dataset: trans_prepared
    table: nessie.risk_analytics.trades_canonical
    mode: merge
    keys:
      - trade_id
      - as_of_date
