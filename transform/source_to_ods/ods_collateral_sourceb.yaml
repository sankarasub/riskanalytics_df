version: 1
name: ods_collateral_sourceb

sources:
  - name: collateral_stage
    type: table
    table: nessie.risk_analytics_stage.collateral_stage_sourceb
    filters:
      - valuation_date = '{{as_of_date}}'

steps:
  - id: passthrough_collateral_sourceb
    type: reformat
    input: collateral_stage
    emit:
      output: collateral_ods

targets:
  - name: ods_collateral
    dataset: collateral_ods
    table: nessie.risk_analytics_ods.collateral
    mode: merge
    keys:
      - collateral_id
      - valuation_date
