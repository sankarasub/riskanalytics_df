version: 1
name: collateral_SourceB_transform

sources:
  - name: collateral_src
    type: file
    format: json
    path: '{{collateral_sourceb_path}}'

steps:
  - id: collateral_cast
    type: reformat
    input: collateral_src
    operations:
      - op: add_column
        name: valuation_date
        expression:
          op: cast
          type: date
          args:
            - col: valuation_date
      - op: add_column
        name: quantity
        expression:
          op: cast
          type: decimal(20,6)
          args:
            - col: quantity
      - op: add_column
        name: market_value
        expression:
          op: cast
          type: decimal(20,2)
          args:
            - col: market_value
      - op: add_column
        name: source_system
        expression:
          lit: 'SourceB'
      - op: add_column
        name: ingest_timestamp
        expression:
          op: current_timestamp
          args: []
    select:
      - collateral_id
      - customer_id
      - asset_id
      - agreement_id
      - collateral_type
      - quantity
      - market_value
      - currency
      - valuation_date
      - source_system
      - ingest_timestamp
    emit:
      output: collateral_prepared

targets:
  - name: collateral_sourceb_stg
    dataset: collateral_prepared
    table: nessie.risk_analytics.collateral_sourceb_stg
    mode: append

  - name: collateral_canonical
    dataset: collateral_prepared
    table: nessie.risk_analytics.collateral_canonical
    mode: merge
    keys:
      - collateral_id
      - valuation_date
