version: 1
name: product_SourceB_transform

sources:
  - name: product_src
    type: file
    format: json
    path: '{{product_sourceb_path}}'

steps:
  - id: product_cast
    type: reformat
    input: product_src
    operations:
      - op: add_column
        name: fixed_rate
        expression:
          op: cast
          type: decimal(12,8)
          args:
            - col: fixed_rate
      - op: add_column
        name: strike
        expression:
          op: cast
          type: decimal(20,6)
          args:
            - col: strike
      - op: add_column
        name: volatility
        expression:
          op: cast
          type: decimal(10,6)
          args:
            - col: volatility
      - op: add_column
        name: barrier_level
        expression:
          op: cast
          type: decimal(20,6)
          args:
            - col: barrier_level
      - op: add_column
        name: source_system
        expression:
          lit: 'SourceB'
      - op: add_column
        name: ingest_timestamp
        expression:
          op: current_timestamp
          args: []
      - op: add_column
        name: product_attributes
        expression:
          op: map_from_json
          args:
            - col: product_attributes
    select:
      - trade_id
      - product_type
      - underlying_id
      - pay_leg_currency
      - receive_leg_currency
      - fixed_rate
      - floating_index
      - strike
      - option_type
      - volatility
      - barrier_level
      - product_attributes
      - source_system
      - ingest_timestamp
    emit:
      output: product_prepared

targets:
  - name: product_sourceb_stg
    dataset: product_prepared
    table: nessie.risk_analytics.trade_product_sourceb_stg
    mode: append

  - name: product_canonical
    dataset: product_prepared
    table: nessie.risk_analytics.trade_product_canonical
    mode: merge
    keys:
      - trade_id
